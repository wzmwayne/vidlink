openapi: 3.0.3

info:
  title: vidlink API
  version: "0.88.0"
  description: |
    多平台视频解析 API：输入分享链接或平台内容 ID，返回平台已发布的直链。
    支持抖音、哔哩哔哩、快手、小红书。人读版本见 API.md，系数见 配额倍率表.md。

    计量单位是**配额**（管理员分配的用量额度，不是余额、与支付无关，API 中无金额字段）：
    `消耗 = 端点系数(端点, 平台) × 条数 × 账号倍率`，只在实际成功时扣减，配额不足返回 429。

    默认只返回 CDN 直链，服务端不代理视频字节。直链通常带 Referer 防盗链，
    浏览器直接 `<video src>` 可能 403：请带上 `Links.headers`，或启用 `/v1/proxy`（默认关闭）。

    鉴权三选一：`X-API-Key` 头 / `Authorization: Bearer` / `?key=`。失败一律 403 且不区分原因。

    ## 公共 Key（vl_public）

    账户模式下服务会准备一个公共账号（`VIDLINK_PUBLIC_KEY`，默认 `vl_public`）：
    Key 公开、免注册，额度是**每 IP 每日 100 配额**（`VIDLINK_PUBLIC_DAILY_QUOTA`），
    与其他端点同一套系数（代理按 0.5 配额/MiB，所有账号同价）。超限返回 `429 public_quota_exhausted`，
    额度按本地时区零点重置。没带 Key 时 `403` 的 message 里会直接给出这个 Key。
    公共 Key 调 `/v1/ledger` 一律 `403`（共享账号，流水混有所有访客）；
    `/v1/usage` 对公共 Key 返回的是"本 IP 今天"的额度（`public: true` + `daily`）。
    每 IP 的日计数只在内存里，重启清零。并发闸门对公共 Key 按 **IP** 生效。
    代理是所有账号统一的 0.5 配额/MiB（`VIDLINK_PROXY_RATE`），
    也就是每日 25 配额约等于 50 MiB 代理流量。

    ## 媒体代理的配额

    `/v1/proxy` 是唯一**按传输体积**计费的出口：`实扣 = 体积(MiB) × 0.5 × 账号倍率`，
    不乘端点系数、也不乘平台系数（代理搬的是任意 CDN 的字节，与上游解析成本无关），
    且**所有账号同一费率**（`VIDLINK_PROXY_RATE`，默认 0.5；1 GB ≈ 512 配额）。
    上游声明了长度时先扣后传（不足直接 429，不发出字节），长度未知时边传边限、
    传完按实际字节补扣；HEAD 不计费，提前中断不退。

    ## 管理面（/v1/admin/*）

    管理凭据是**一个固定的 Key**（环境变量或 .vl 里的 `VIDLINK_ADMIN_KEY`），
    不是账本里的账号、也不是账号上的权限位：账号 Key 一律进不了管理面（403），
    管理 Key 也不能用来解析（它不在账本里）。**没有配置这个 Key 时，
    每条 /v1/admin/* 都恒返回 403**（message 里会点名该配置项）。
    账号路径参数 `{key}` 可以是明文 Key，也可以是账号的公开句柄 `id`（`acc_…`，
    Key 的 SHA-256 截断），后者让管理面板不必接触明文 Key。

    `VL_WEBUI=true` 时还提供两个自带页面：`/`（解析页）与 `/admin`（管理面板，
    填管理 Key 后所有请求自动带上）。页面本身是公开的壳，数据一律要凭据。

    ## 免校验模式（VL_EASE=true）

    启动时设置 `VL_EASE=true` 会关闭**整个账户体系**：不需要任何凭据、不计量配额、
    不回写 `X-Quota-*`、关闭按 IP 限流；`/v1/usage` 与 `/v1/admin/*` 不被注册（404）；
    `/v1/platforms` 不再返回 `rates`/`unit`；批量响应的 `cost` 恒为 0。
    四个解析端点与公开端点完全可用。`/v1/health`、`/v1/platforms` 会返回
    `"mode": "ease"`。该模式没有任何身份校验，**不得暴露到公网**。
    并发三层：按 IP 限流（429）、按 Key 并发 1（仅计量端点；429，不排队）、
    全局解析槽位 10 + 队列 30（503）。

servers:
  # 路径全部是相对路径；这里给两个可选基地址。
  # 官方测试实例：公共 Key vl_public 免注册可试（跑在树莓派上，可能限流/变动，生产请自部署）
  - { url: "https://vl.wzml.cc.cd", description: 官方测试实例（可直接试；生产请自部署） }
  - { url: "/", description: 相对当前服务地址（自部署默认 http://127.0.0.1:8080） }

tags:
  - { name: 元信息, description: 公开端点 }
  - { name: 账号, description: 账号自查（需 Key） }
  - { name: 计量, description: 按配额计量（需 Key） }
  - { name: 管理, description: 管理面（需固定管理 Key：VIDLINK_ADMIN_KEY） }
  - { name: 运维, description: 探针与可选代理 }

paths:
  /v1/version:
    get:
      tags: [元信息]
      summary: 版本信息
      security: []
      operationId: getVersion
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } }

  /v1/health:
    get:
      tags: [元信息]
      summary: 健康检查 + 缓存统计
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }

  /v1/platforms:
    get:
      tags: [元信息]
      summary: 平台清单与各端点系数（不消耗配额）
      security: []
      operationId: listPlatforms
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PlatformList" } } }

  /healthz:
    get:
      tags: [运维]
      summary: 存活探针
      security: []
      operationId: getHealthz
      responses:
        "200":
          description: 存活
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: alive } } }

  /readyz:
    get:
      tags: [运维]
      summary: 就绪探针（无可用平台时 503）
      security: []
      operationId: getReadyz
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  platforms: { type: integer, example: 4 }
        "503":
          description: 未就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  reason: { type: string }

  /v1/usage:
    get:
      tags: [账号]
      summary: 自己的配额、用量、倍率与各端点系数（不消耗配额）
      operationId: getUsage
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Usage" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/search:
    get:
      tags: [计量]
      summary: 按关键词搜索（bilibili / jianpian）：元信息 + ID，不含直链
      description: |
        按 **返回条数** 计价（默认 0.25/条，与 info 的半价）；空结果不扣。
        返回的 items[].id 才是拿去 /v1/detail、/v1/links 的 ID。
        不支持搜索的平台返回 400 并说明原因，见 /v1/platforms 的 search/search_reason。
      operationId: search
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string, enum: [bilibili, jianpian] }
        - name: keyword
          in: query
          required: true
          description: 关键词（1~64 字符）；别名 q
          schema: { type: string, maxLength: 64 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/Quota" }

  /v1/info:
    get:
      tags: [计量]
      summary: 元信息 + 可用档位列表（无直链）
      description: 消耗 0.5（抖音 0.75）。
      operationId: getInfo
      parameters:
        - $ref: "#/components/parameters/Url"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ContentID"
      responses:
        "200":
          description: OK
          headers: { $ref: "#/components/headers/QuotaHeaders" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Info" } } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/links:
    get:
      tags: [计量]
      summary: 只取直链（无元信息）
      description: 消耗 1.0（抖音 1.1）。
      operationId: getLinks
      parameters:
        - $ref: "#/components/parameters/Url"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ContentID"
        - $ref: "#/components/parameters/Quality"
      responses:
        "200":
          description: OK
          headers: { $ref: "#/components/headers/QuotaHeaders" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Links" } } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/detail:
    get:
      tags: [计量]
      summary: 元信息 + 全部档位直链 + 字幕/图集
      description: 消耗 1.2（抖音 1.5）。
      operationId: getDetail
      parameters:
        - $ref: "#/components/parameters/Url"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ContentID"
      responses:
        "200":
          description: OK
          headers: { $ref: "#/components/headers/QuotaHeaders" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Detail" } } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/batch/links:
    post:
      tags: [计量]
      summary: 批量取直链（5~20 条，不支持抖音）
      description: |
        每条 0.75，只按**成功条数**结算。抖音在解析前就被挡掉（纯本地判定）。
        下限 5 条，否则 1 条也能享受批量下调，失去引导合并的意义。
      operationId: postBatchLinks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchLinksRequest" }
      responses:
        "200":
          description: OK
          headers: { $ref: "#/components/headers/QuotaHeaders" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchLinksResponse" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/checkin:
    post:
      tags: [账号]
      summary: 每日签到领配额（每天一次）
      description: |
        账号上由管理员设置 daily_grant（每日可领）与 grant_cap（停止增加界限，
        0=不封顶）：余额 = min(余额 + daily_grant, grant_cap)。**不消耗配额**。
        今天已签返回 200 + already_checked_in=true；余额已达界限返回 200 +
        at_cap=true 且不占用当天机会；账号未开放签到返回 400；公共 Key 返回 403。
      operationId: checkIn
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckIn" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sign:
    get:
      tags: [账号]
      summary: 用当前 Key 换一条签名凭据（给 URL 用，约 30 秒有效）
      description: |
        URL 里只接受签名凭据（明文 Key 只能走请求头）。凭据形态：
        `acc_<16位句柄>.<8位hex时间戳>.<64位hex签名>`，其中
        签名 = hex(HMAC-SHA256(Key, "句柄|时间戳hex"))，完整 64 位。
        服务端校验时读出票面时间戳做减法（|now-ts| <= ttl），再正向复算一次
        HMAC 比对 —— 不需要反推时间戳，也不需要遍历候选。**不消耗配额**。
        签名不绑定具体请求：有效期内可调用该账号任意接口，消耗记在该账号上。
      operationId: sign
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sign" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/ledger:
    get:
      tags: [账号]
      summary: 自己的配额流水（账单）：使用 / 管理员增加 / 减少 / 设置
      description: |
        只能读自己的（服务端按 Key 限定）。**不消耗配额**。
        units 带符号（消耗为负）；totals 为全量口径，entries 只保留最近若干条。
      operationId: getLedger
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: type
          in: query
          schema: { type: string, enum: [consume, add, reduce, set, create, delete] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/ledger:
    get:
      tags: [管理]
      summary: 配额流水：总账单，或指定账号（account 句柄 / 明文 Key）
      description: |
        不带 account/id 即总账单。**不消耗配额**。
        参数名不是 `key`：`key` 在这个 API 里是"凭据"的意思，而 URL 里只收签名；
        用 `?key=<明文>` 会被当成一次认证尝试并因格式错误 403。
      operationId: adminLedger
      parameters:
        - name: account
          in: query
          description: 账号公开句柄 acc_… 或明文 Key
          schema: { type: string }
        - name: id
          in: query
          description: 与 account 同义（旧参数名）
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: type
          in: query
          schema: { type: string, enum: [consume, add, reduce, set, create, delete] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/accounts:
    get:
      tags: [管理]
      summary: 账号列表（Key 掩码）
      operationId: adminListAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
                  stats: { $ref: "#/components/schemas/AccountStats" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [管理]
      summary: 创建账号
      description: 不填 `key` 时自动生成 256 位随机 Key，明文只在本次响应返回一次。
      operationId: adminCreateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  key: { type: string, description: 自动生成时的明文 Key（只此一次） }
                  notice: { type: string }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/accounts/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: 账号的明文 Key，或列表返回的公开句柄 id（acc_…）
        schema: { type: string }
    get:
      tags: [管理]
      summary: 查看单个账号（Key 掩码）
      operationId: adminGetAccount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { account: { $ref: "#/components/schemas/Account" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [管理]
      summary: 修改账号（配额 / 倍率 / 停用）
      operationId: adminPatchAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchAccountRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { account: { $ref: "#/components/schemas/Account" } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [管理]
      summary: 删除账号（管理 Key 不在账本里，删谁都不影响管理面）
      operationId: adminDeleteAccount
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: boolean, example: true } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/accounts/{key}/reset_key:
    parameters:
      - name: key
        in: path
        required: true
        description: 账号的明文 Key，或公开句柄 id（acc_…）
        schema: { type: string }
    post:
      tags: [管理]
      summary: 重置账号 Key（手填或随机；配额与用量保留，旧 Key 立刻失效）
      description: |
        不传请求体（或 `{"key": ""}`）= 服务端生成 256 位随机 Key。
        明文 Key **只在这一次响应里出现**；句柄由 Key 派生，因此会变，
        响应里给出 handle / old_handle。公共账号（VIDLINK_PUBLIC_KEY）拒绝重置。
      operationId: adminResetAccountKey
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetKeyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetKeyResult" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/stats:
    get:
      tags: [管理]
      summary: 运行统计（账号 / 闸门 / 缓存 / 流量）
      operationId: adminStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { $ref: "#/components/schemas/AccountStats" }
                  gate: { $ref: "#/components/schemas/GateStats" }
                  cache: { $ref: "#/components/schemas/CacheStats" }
                  traffic:
                    type: object
                    properties:
                      requests: { type: integer, format: int64 }
                      errors: { type: integer, format: int64 }
                      uptime_sec: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/quota:
    get:
      tags: [管理]
      summary: 计费倍率全貌（生效值 + 覆盖层 + 审计）
      description: |
        返回当前**生效值**、改过的格子（overrides）、出厂默认（defaults）、
        预授权上限、校验范围、定价告警（warnings）与最近 50 条变更（history）。
        倍率可在运行期修改：PUT 改格子/代理费率，DELETE 恢复出厂默认。
        单账号的临时调整仍走该账号的 `multiplier`。
      operationId: adminQuota
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaTable" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [管理]
      summary: 修改计费倍率（逐格合并；null 表示恢复默认）
      description: |
        只提交要改的格子，其余保持不变。任何一格非法 → 整请求 400，不会部分生效。
        抖音 × batch_links 不能设（平台能力问题，不是价格）。改价只影响后续请求；
        落盘失败返回 500 且内存已回滚。
      operationId: adminQuotaUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaUpdateRequest" }
      responses:
        "200":
          description: OK（与 GET 同形，便于前端一次往返重渲染）
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaTable" } } }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [管理]
      summary: 恢复出厂默认倍率（清空全部覆盖，含代理费率）
      operationId: adminQuotaReset
      responses:
        "200":
          description: OK（与 GET 同形）
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaTable" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/sign:
    get:
      tags: [管理]
      summary: 用管理 Key 换一条管理签名（给管理接口链接用，约 30 秒有效）
      description: |
        返回 `adm_…` 凭据，只能在 `/v1/admin/*` 上使用；账号签名（acc_）打管理接口
        会 403 key_scope，反之亦然。句柄必须由 VIDLINK_ADMIN_KEY 派生，
        所以轮换管理 Key 会让旧签名立刻失效。**不消耗配额**。
      operationId: adminSign
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sign" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/proxy:
    get:
      tags: [运维]
      summary: 流式媒体代理（免校验模式默认开启）
      description: |
        透传 Range/If-Range。仅当 `VIDLINK_PROXY_ENDPOINT=true` 时该路由才存在；
        该开关的默认值跟随运行模式（免校验模式为 true，账户模式为 false），
        显式设成 false 可关闭。
        `VIDLINK_PROXY_ALLOW_HOSTS` 留空表示放行任意 http/https 目标
        （等同于开放代理，勿暴露公网）；填了则只放行匹配后缀的域名，其余 403。
      operationId: proxyMedia
      parameters:
        - name: url
          in: query
          required: true
          description: 媒体地址（http/https 绝对地址）
          schema: { type: string }
        - name: referer
          in: query
          required: false
          description: 覆盖默认 Referer
          schema: { type: string }
        - name: filename
          in: query
          required: false
          description: |
            设置 `Content-Disposition: attachment; filename=...`（中文按 RFC 2231 编码）。
            服务端会消毒：去掉控制字符、引号、路径分隔符并限长 120 字符。
          schema: { type: string, example: "标题VL视频1080P.mp4" }
        - name: type
          in: query
          required: false
          description: |
            覆盖上游 `Content-Type`（CDN 对 .m4s 常回 application/octet-stream）。
            只放行 video/*、audio/* 与 application/octet-stream。
          schema: { type: string, enum: [video/mp4, audio/mp4, video/webm, audio/webm, application/octet-stream] }
      responses:
        "200":
          description: 媒体字节流
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206": { description: 部分内容（Range） }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    ApiKeyHeader: { type: apiKey, in: header, name: X-API-Key }
    BearerAuth: { type: http, scheme: bearer }
    # URL 里**只接受签名凭据**（明文 Key 会 403）：
    #   acc_<16位句柄>.<8位hex时间戳>.<64位hex签名>（账号）/ adm_…（管理）
    # 由 GET /v1/sign 或 GET /v1/admin/sign 签发，约 30 秒有效。
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: 签名凭据（acc_… / adm_…），不是明文 Key

  security:
    - ApiKeyHeader: []
    - BearerAuth: []
    - ApiKeyQuery: []

  headers:
    QuotaHeaders:
      X-Quota-Consumed:
        description: 本次调用消耗的配额
        schema: { type: number, format: double, example: 1 }
      X-Quota-Remaining:
        description: 该账号剩余可用配额
        schema: { type: number, format: double, example: 99 }

  parameters:
    Url:
      name: url
      in: query
      required: false
      description: |
        分享链接或整段分享文案（自动从文本里提取链接）。
        **可以不带 `http://`**（如 `www.bilibili.com/video/BV1xx`，会自动补成 https）。
        与 platform + id 二选一。
      schema: { type: string }
    Platform:
      name: platform
      in: query
      required: false
      description: 平台标识（与 id 一起使用）
      schema: { type: string, enum: [douyin, bilibili, kuaishou, xiaohongshu, jianpian] }
    SearchResult:
      type: object
      properties:
        platform: { type: string }
        keyword: { type: string }
        page: { type: integer }
        limit: { type: integer }
        count: { type: integer }
        total: { type: integer, description: 平台声明的匹配总数（可能被截断） }
        has_more: { type: boolean }
        next: { type: string, description: 下一页的现成参数 }
        cost: { type: number, description: 本次扣减 = 0.25 × count × 账号倍率；空结果不出现 }
        cached: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              platform: { type: string }
              type: { type: string, enum: [video, series, movie] }
              id: { type: string, description: 拿去 detail/links 的 ID }
              title: { type: string }
              desc: { type: string }
              cover: { type: string }
              url: { type: string }
              score: { type: number }
              year: { type: integer }
              category: { type: string }
              latest: { type: string }
              actors: { type: array, items: { type: string } }
              detail: { type: string, description: 现成的下一步调用提示 }
    ResetKeyRequest:
      type: object
      properties:
        key:
          type: string
          description: 新 Key（可省 vl_ 前缀，服务端自动补）；留空 = 随机生成
    ResetKeyResult:
      type: object
      properties:
        account: { $ref: "#/components/schemas/Account" }
        key: { type: string, description: 明文新 Key，只在这里出现一次 }
        handle: { type: string }
        old_handle: { type: string }
        notice: { type: string }
    ContentID:
      name: id
      in: query
      required: false
      description: 平台内内容 ID（与 platform 一起使用）
      schema: { type: string }
    Quality:
      name: quality
      in: query
      required: false
      description: 目标清晰度：`1080` / `720P` / `qn:80`；缺省取推荐档。档位不存在返回 400（不消耗配额）。
      schema: { type: string, example: "1080" }

  responses:
    BadInput:
      description: 参数不合法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 缺少或无效 Key、账号停用、需要登录态
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 内容不存在或已删除
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 配额不足（quota_exhausted）、按 Key 并发超限（concurrency_limited）或按 IP 限流（rate_limited）
      headers:
        Retry-After:
          description: 建议重试间隔（秒）
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Upstream:
      description: 上游平台异常（抖音限流也表现为这里）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: 本地过载：解析槽位与排队都满
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              enum: [bad_input, unsupported, not_found, forbidden, rate_limited,
                     concurrency_limited, quota_exhausted, timeout, upstream_error,
                     unavailable, method_not_allowed, internal]
            message: { type: string }
            request_id: { type: string }

    Version:
      type: object
      properties:
        version: { type: string, example: "1.4.0" }
        api_version: { type: string, example: v1 }
        platform: { type: string, example: linux/arm64 }

    CacheStats:
      type: object
      description: coalesced 是被请求合并省掉的上游调用数
      properties:
        entries: { type: integer }
        hits: { type: integer, format: int64 }
        misses: { type: integer, format: int64 }
        coalesced: { type: integer, format: int64 }
        loads: { type: integer, format: int64 }

    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        mode: { type: string, enum: [account, ease], description: 运行模式 }
        webui:
          type: boolean
          description: 根路径是否为图形化页面（VL_WEBUI）；账户模式下该页面公开，但页内数据请求仍需 API Key
        version: { type: string }
        api_version: { type: string }
        uptime_sec: { type: integer }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        cache: { $ref: "#/components/schemas/CacheStats" }

    PlatformList:
      type: object
      properties:
        platforms:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: bilibili }
              hosts: { type: array, items: { type: string } }
              supports_id: { type: boolean }
              has_cookie: { type: boolean }
              rates:
                type: object
                additionalProperties: true
                description: 各端点系数；不支持批量时 batch_links 是带 reason 的对象
              batch: { type: boolean }
              batch_reason: { type: string }
        mode: { type: string, enum: [account, ease] }
        unit: { type: string, example: 配额, description: 免校验模式下不返回 }
        limits:
          type: object
          properties:
            batch_min: { type: integer, example: 5 }
            batch_max: { type: integer, example: 20 }

    Sign:
      type: object
      description: 一条签名凭据（URL 里唯一允许的凭据形态）
      properties:
        key:
          type: string
          example: acc_17090c89a1ca6ee3.68a3e658.35c1daf1f0dfefd2bb15906d25ff8e6e5dfaf2ce9757749b7ccbcb0c4a2a46c9
        query: { type: string, description: 可直接拼到 URL 后面的 `key=…` 形式 }
        type: { type: string, enum: [account, admin] }
        ttl: { type: integer, description: 时间容差与有效期（秒） }
        issued_at: { type: integer, description: 票面时间戳（unix 秒） }
        expires_at: { type: integer, description: issued_at + ttl }
        note: { type: string }
    Usage:
      type: object
      description: |
        普通账号：quota/used/calls 是自己的账本数据。
        公共 Key（vl_public）：public=true，quota 是"本 IP 今日剩余"，
        daily 给出每日额度与重置时间，且不提供账单。
      properties:
        name: { type: string }
        unit: { type: string, example: 配额 }
        quota: { type: number, description: 剩余可用配额 }
        used: { type: number }
        calls: { type: integer }
        multiplier: { type: number }
        rates: { type: object, additionalProperties: true }
        limits:
          type: object
          properties:
            per_key_concurrency: { type: integer }
            global_concurrency: { type: integer }
            batch_min: { type: integer }
            batch_max: { type: integer }

    Author:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string }

    Stats:
      type: object
      properties:
        view: { type: integer, format: int64 }
        like: { type: integer, format: int64 }
        comment: { type: integer, format: int64 }
        collect: { type: integer, format: int64 }
        share: { type: integer, format: int64 }
        danmaku: { type: integer, format: int64 }
        duration: { type: integer, description: 秒 }

    Quality:
      type: object
      description: 可选档位描述，不含直链
      properties:
        height: { type: integer, example: 1080 }
        label: { type: string, example: 1080P }
        quality_id: { type: integer, example: 80 }
        codecs: { type: array, items: { type: string } }

    Image:
      type: object
      properties:
        url: { type: string }
        live_photo_url: { type: string }
        width: { type: integer }
        height: { type: integer }

    Stream:
      type: object
      properties:
        url: { type: string }
        backup_urls: { type: array, items: { type: string } }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 播放/下载该直链时必须携带的请求头
        quality: { type: string, example: 1080P }
        quality_id: { type: integer }
        codec: { type: string, example: avc1.640032 }
        mime_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        frame_rate: { type: string }
        bandwidth: { type: integer }
        size: { type: integer, format: int64 }
        duration: { type: number, format: double }

    Subtitle:
      type: object
      properties:
        lang: { type: string }
        name: { type: string }
        url: { type: string }
        format: { type: string }

    Info:
      type: object
      properties:
        platform: { type: string }
        id: { type: string }
        title: { type: string }
        desc: { type: string }
        cover: { type: string }
        author: { $ref: "#/components/schemas/Author" }
        stats: { $ref: "#/components/schemas/Stats" }
        source_url: { type: string }
        qualities: { type: array, items: { $ref: "#/components/schemas/Quality" } }
        images: { type: array, items: { $ref: "#/components/schemas/Image" } }
        warning: { type: string, description: 降级提示（例如只拿到 480P） }
        cached: { type: boolean }

    Links:
      type: object
      required: [url]
      properties:
        url: { type: string }
        backup_urls: { type: array, items: { type: string } }
        headers: { type: object, additionalProperties: { type: string } }
        audio_url: { type: string, description: DASH 分离流的音频直链 }
        needs_mux: { type: boolean, description: 为 true 时需要自行混流 }

    Detail:
      allOf:
        - $ref: "#/components/schemas/Info"
        - type: object
          properties:
            videos: { type: array, items: { $ref: "#/components/schemas/Stream" } }
            audios: { type: array, items: { $ref: "#/components/schemas/Stream" } }
            needs_mux: { type: boolean }
            music: { $ref: "#/components/schemas/Stream" }
            subtitles: { type: array, items: { $ref: "#/components/schemas/Subtitle" } }
            best_video_url: { type: string }
            best_video_headers: { type: object, additionalProperties: { type: string } }
            best_audio_url: { type: string }

    BatchLinksRequest:
      type: object
      description: urls 与 text 至少给一个；text 按行拆分
      properties:
        urls: { type: array, items: { type: string } }
        text: { type: string }
        quality: { type: string }

    BatchLinksResponse:
      type: object
      properties:
        total: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        cost: { type: number, description: 本次消耗（只计成功条数，已含账号倍率） }
        results:
          type: array
          items:
            type: object
            properties:
              input: { type: string }
              links: { $ref: "#/components/schemas/Links" }
              error:
                type: object
                properties:
                  kind: { type: string }
                  message: { type: string }

    Account:
      type: object
      description: 账号**没有任何权限位**：管理权限属于固定的管理 Key，不属于账号
      properties:
        id: { type: string, description: "公开句柄 acc_…（Key 的 SHA-256 截断，可用于路径参数）" }
        key: { type: string, description: 掩码后的 Key（仅创建时返回明文） }
        name: { type: string }
        note: { type: string }
        quota: { type: number, description: 剩余可用配额 }
        used: { type: number }
        calls: { type: integer }
        multiplier: { type: number }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CheckIn:
      type: object
      properties:
        granted: { type: number, description: 本次真正加上的配额（已达界限时为 0） }
        balance: { type: number, description: 签到后的余额 }
        daily: { type: number, description: 每日签到额度 }
        cap: { type: number, description: 停止增加界限（0 = 不封顶） }
        already_checked_in: { type: boolean }
        at_cap: { type: boolean, description: 余额已在界限上；不占用当天机会 }
        checked_in: { type: boolean }
        next_checkin_at: { type: string, format: date-time }
        unit: { type: string, example: 配额 }
        message: { type: string }

    Ledger:
      type: object
      description: 配额流水（账单）。不消耗配额；totals 为全量口径
      properties:
        scope: { type: string, enum: [self, all, account] }
        account:
          type: object
          additionalProperties: true
          description: scope=self/account 时带上该账号的摘要
        unit: { type: string, example: 配额 }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        totals:
          type: object
          additionalProperties:
            type: object
            properties:
              count: { type: integer, format: int64 }
              units: { type: number, description: 带符号净变化；累计消耗 = -totals.consume.units }
        types:
          type: object
          additionalProperties: { type: string }
          description: 各类型的中文含义（由服务端给出，避免前端各写一份）
        limit_max: { type: integer }
        note: { type: string }

    LedgerEntry:
      type: object
      properties:
        time: { type: string, format: date-time }
        type: { type: string, enum: [consume, add, reduce, set, create, delete] }
        key: { type: string, description: 掩码后的 Key }
        id: { type: string, description: 账号公开句柄 }
        name: { type: string }
        units: { type: number, description: 带符号变化量：消耗为负、管理员增加为正 }
        balance: { type: number, description: 这条流水之后的剩余配额 }
        used: { type: number }
        calls: { type: integer, format: int64 }
        detail: { type: string, description: "人能读的说明，例如 links/bilibili ×1、proxy 66.53 MiB（按体积）" }

    AccountStats:
      type: object
      properties:
        accounts: { type: integer }
        active: { type: integer }
        used_total: { type: number }
        calls_total: { type: integer, format: int64 }
        quota_total: { type: number }

    GateStats:
      type: object
      properties:
        global_limit: { type: integer }
        global_in_use: { type: integer }
        global_free: { type: integer }
        waiting: { type: integer, format: int64 }
        max_queue: { type: integer }
        active_keys: { type: integer }
        rejected_key_busy: { type: integer, format: int64 }
        rejected_queue_full: { type: integer, format: int64 }
        timed_out: { type: integer, format: int64 }

    CreateAccountRequest:
      type: object
      properties:
        key: { type: string, description: 留空则自动生成 256 位随机 Key }
        name: { type: string }
        quota: { type: number, description: 初始配额 }
        multiplier: { type: number, default: 1, description: "缺省 1.0；0 表示不扣配额，是有含义的取值" }
        note: { type: string }

    PatchAccountRequest:
      type: object
      description: 全部字段可选；quota 与 add_quota 不能同时使用
      properties:
        name: { type: string }
        note: { type: string }
        quota: { type: number, description: 设为该值（剩余配额） }
        add_quota: { type: number, description: 在现有剩余配额上加减 }
        multiplier: { type: number }
        disabled: { type: boolean }

    QuotaUpdateRequest:
      type: object
      description: 逐格合并；未出现的格子不动，值为 null 表示清除该格的自定义（回到出厂默认）
      properties:
        rates:
          type: object
          description: 平台 → 端点 → 倍率或 null
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              nullable: true
        proxy_rate:
          type: number
          nullable: true
          description: 代理费率（配额/MiB，0 表示代理不扣配额）；null 表示恢复默认

    QuotaTable:
      type: object
      properties:
        unit: { type: string, example: 配额 }
        formula: { type: string, example: "消耗 = 端点系数(端点, 平台) × 条数 × 账号倍率" }
        endpoints: { type: object, additionalProperties: { type: string } }
        source: { type: string, enum: [defaults, file], description: 值来自内置默认还是倍率文件 }
        path: { type: string, description: 倍率文件路径（可能为空） }
        updated_at: { type: string, format: date-time }
        default_platform:
          type: object
          additionalProperties: { type: number }
          description: 通用档（未单列的平台走它）
        overrides:
          type: object
          description: 被管理员改过的格子（平台 → 端点 → 倍率）
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        defaults:
          type: object
          description: 出厂默认（平台 → 端点 → 倍率）
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        limits:
          type: object
          properties:
            min_rate: { type: number }
            max_rate: { type: number }
        warnings:
          type: array
          items: { type: string }
          description: 定价提示（例如 detail 比 links 还便宜）；只提示不阻止保存
        history:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              action: { type: string, enum: [update, reset] }
              actor: { type: string, description: 恒为 admin（管理面只有一个固定 Key） }
              detail: { type: string }
        preauth_max:
          type: object
          additionalProperties: { type: number }
          description: 各端点的预授权上限（该端点在所有平台中的最高**生效**系数，改价后立刻重算）
        platforms: { type: object, additionalProperties: true }
        note: { type: string }
