name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]        # 打 tag 时除了构建，还会把所有产物发到 Release
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消进行中的旧运行，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 格式 / 静态检查 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 本模块零第三方依赖，但仍会读 go.mod 决定工具链版本。
      #
      # 注意 git diff 的路径写法：必须用 `--` 分隔，且只列**已跟踪**的文件。
      # 若把不存在的 go.sum 一起写进去，git 会直接以 128 退出，
      # 于是这条检查会在"什么都没变"的情况下报"go.mod 被改了"。
      - name: 校验依赖没有增长
        run: |
          go mod tidy
          git diff --exit-code -- go.mod \
            || { echo "::error::go.mod 有未提交的改动（本项目应保持零第三方依赖）"; exit 1; }
          if [ -e go.sum ]; then
            echo "::error::本项目零第三方依赖，不应出现 go.sum"
            exit 1
          fi
          count=$(go list -m all | tail -n +2 | wc -l)
          echo "第三方依赖数: $count"
          [ "$count" -eq 0 ] || { echo "::error::依赖数应为 0"; exit 1; }

      - name: 格式检查
        run: make fmt-check

      - name: 静态检查
        run: make vet

      - name: 单元测试（含竞态检测）
        run: go test -race ./...

      - name: 校验 OpenAPI 规格
        run: make openapi

  # 交叉编译：一个目标一个 runner，矩阵并行。
  #
  # 为什么放在 CI 而不是本地 make build-all：交叉编译要为目标平台重新编译
  # 整个标准库，8 个目标在开发机上是一串串行等待；矩阵化之后每个目标各占
  # 一个 runner，总耗时约等于最慢的那一个。产物同时留档，打 tag 时直接发版。
  #
  # 目标清单与 Makefile 的 TARGETS 保持一致（含 GOARM 档位）。
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 一个目标挂了，其余目标的结果仍然要看得到
      matrix:
        include:
          - { target: linux/amd64,     artifact: vidlink-linux-amd64 }
          - { target: linux/arm64,     artifact: vidlink-linux-arm64 }
          - { target: linux/arm/7,     artifact: vidlink-linux-armv7 }
          - { target: linux/arm/6,     artifact: vidlink-linux-armv6 }
          - { target: linux/386,       artifact: vidlink-linux-386 }
          - { target: windows/amd64,   artifact: vidlink-windows-amd64 }
          - { target: windows/arm64,   artifact: vidlink-windows-arm64 }
          - { target: windows/386,     artifact: vidlink-windows-386 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 构建 ${{ matrix.target }}
        run: make build-one TARGET=${{ matrix.target }}

      - name: 校验产物格式与依赖数
        run: |
          f=$(ls dist/${{ matrix.artifact }}* )
          file "$f"
          # Windows 产物必须是 PE，Linux 必须是静态 ELF：
          # 交叉编译最典型的失败是"编出来了但格式不对"，用 file 一眼可查。
          case "${{ matrix.target }}" in
            windows/*) file "$f" | grep -q "PE32" || { echo "::error::不是 PE 格式"; exit 1; } ;;
            *)         file "$f" | grep -q "ELF"  || { echo "::error::不是 ELF 格式"; exit 1; } ;;
          esac
          file "$f" | grep -q "statically linked" || true
          echo "第三方依赖数: $(go list -m all | tail -n +2 | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 14

  # 打 tag 时把所有产物汇总成一个 Release（用 runner 自带的 gh，不引第三方 action）
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 用 gh CLI 而不是 actions/download-artifact：前者能在循环里重试。
      # 实测遇到过一次"8 个产物下了 7 个，最后一个 5 次重试后失败"——
      # 纯粹的瞬时抖动，不该让整场发布失败。
      - name: 下载全部产物（失败自动重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            rm -rf dist && mkdir -p dist
            if gh run download "$GITHUB_RUN_ID" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern 'vidlink-*' --dir dist; then ok=1; break; fi
            echo "第 $i 次下载失败，5 秒后重试"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::产物下载连续失败"; exit 1; }
          # gh 按产物名建子目录（dist/vidlink-linux-amd64/vidlink-linux-amd64），
          # 摊平时不能直接往 dist/ 里 mv：文件名与同名的目录会撞车
          # （mv: cannot overwrite directory 'dist/vidlink-linux-amd64'）。
          # 先收进一个干净的 out/ 再整体替换。
          mkdir -p out
          find dist -type f -exec mv -f {} out/ \;
          rm -rf dist && mv out dist
          ls -lh dist/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  docker:
    name: 容器镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只验证能构建，不推送（推送需要仓库配置 registry 凭据）
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
